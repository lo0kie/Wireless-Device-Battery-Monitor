name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default: builds of pull requests cannot change the repository or releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Select version and update channel
        shell: pwsh
        run: |
          $version = '0.0.0'
          $channel = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Unsupported release tag' }
            if ($env:GITHUB_REPOSITORY -eq 'krisgfx9/Wireless-Device-Battery-Monitor') { $channel = 'stable' }
          }
          "WB_VERSION=$version" >> $env:GITHUB_ENV
          "WB_CHANNEL=$channel" >> $env:GITHUB_ENV

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          # third_party is not in the repository (see .gitignore): the settings window needs the SDK
          # headers and the loader DLL that res/app.rc embeds. Pinned version + checksum, like the
          # bundled HeadsetControl binary.
          $root = "third_party/webview2"
          if (Test-Path "$root/include/WebView2.h") { return }
          $ver = "1.0.4370.26"
          $nupkg = "$root/wv2.zip"
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile $nupkg
          if ((Get-FileHash $nupkg -Algorithm SHA256).Hash -ne '1C0DACAC84B70109B3FD42F90C53A0BA942ABC3A87590D7A4E0CCD86E4A06CF4') { throw 'WebView2 SDK checksum mismatch' }
          Expand-Archive $nupkg -DestinationPath "$root/pkg" -Force
          New-Item -ItemType Directory -Force "$root/include", "$root/x64" | Out-Null
          Copy-Item "$root/pkg/build/native/include/WebView2.h", "$root/pkg/build/native/include/WebView2EnvironmentOptions.h" "$root/include/"
          Copy-Item "$root/pkg/build/native/x64/WebView2Loader.dll" "$root/x64/"
          Remove-Item $nupkg, "$root/pkg" -Recurse -Force

      - name: Build BatteryHub.exe
        shell: msys2 {0}
        run: make VERSION="$WB_VERSION" CHANNEL="$WB_CHANNEL"

      - name: Test device protocols and Windows updater
        shell: msys2 {0}
        run: make test VERSION="$WB_VERSION" CHANNEL="$WB_CHANNEL"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -Version $env:WB_VERSION

      - name: Fetch HeadsetControl source (GPL corresponding source for the bundled binary)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-4.3.0.tar.gz -OutFile dist/headsetcontrol-4.3.0.tar.gz
          if ((Get-FileHash dist/headsetcontrol-4.3.0.tar.gz -Algorithm SHA256).Hash -ne '918dcacf8aef347744b36b2d259d76880fa64b3869f0f8ef26b6576b873d28a7') { throw 'checksum mismatch' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BatteryHub
          path: dist/*

  # Only this job can publish, and only for version tags pushed by the maintainer.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read  # the Discord announcement reads merged PR titles
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: BatteryHub
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          # The notes are generated from the commits since the previous tag; a hand-written body would
          # suppress the generator, so there is none here.
          generate_release_notes: true

      # Announce the release on Discord: first what changed, then the newly supported devices.
      # The webhook lives in the DISCORD_WEBHOOK repository secret, never in the code. A failed post
      # does not fail the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discord-release.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
